<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Transport Viewer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <!-- Add hospital-transport-utils.js before main.js -->
    <script src="{{ url_for('static', filename='js/hospital-transport-utils.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div id="main-header">
  <h1>🚑 Hospital Transport Playground</h1>
  <div class="main-actions">
    <a href="/simulator" class="nav-button">🚀 Simulator</a>
    <a href="/benchmark" class="nav-button">📊 Benchmark</a>
    <a href="/" class="nav-button">🏠 Home</a>
  </div>
</div>

    <div id="logPanel">
        <h3>🚑 Transport Log</h3>
        <ul id="logList"></ul>
    </div>

    <!-- New Strategy Selector Section -->
    <div class="strategy-selector">
        <h3>🧪 Optimization Strategy</h3>
        <label for="strategyDropdown">Select Strategy:</label>
        <select id="strategyDropdown"></select>
        <button id="deployStrategyBtn">Deploy Selected Strategy</button>
    </div>

    <div class="controls">
        <button onclick="location.href='/simulator'">🚀 Launch Simulator</button>

        <label for="transporterSelect">Choose a Transporter:</label>
        <select id="transporterSelect"></select>

        <label for="statusDropdown">Set Transporter Status:</label>
        <select id="statusDropdown">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
        </select>
        <button onclick="setTransporterStatus()">Update Status</button>

        <button onclick="deployOptimization()">Solve with Selected Optimizer</button>
        <button onclick="deployRandomness()">Solve with Randomizer</button>

        <div id="sim-clock"
            style="position: fixed; top: 10px; right: 10px;
                   background: white; padding: 8px 12px;
                   border: 1px solid #ccc; border-radius: 4px;
                   font-size: 18px; font-family: monospace; z-index: 1000;">
            ⏱️ Simulation Time: 00:00:00
        </div>

        <label for="requestSelect">Choose a Transport Request:</label>
        <select id="requestSelect"></select>

        <input type="text" id="transporterName" placeholder="Transporter Name">
        <button onclick="addTransporter()">Add Transporter</button>

        <button onclick="initiateTransport()">Initiate Patient Transport</button>
        <button id="returnHomeBtn" onclick="returnHome()">Return Home</button>

        <button id="simulateOptimally" onclick="simulateOptimally()">Simulate with Selected Strategy</button>
        <button id="simulateRandomly" onclick="simulateRandomly()">Simulate Randomly</button>
        <button id="stopSimulationBtn" onclick="stopSimulation()" style="display:none;">Stop Simulation</button>
    </div>

    <div class="view-controls" style="margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 5px;">
        <label for="viewModeSelect"><b>View Mode:</b></label>
        <select id="viewModeSelect" onchange="transportSystem.ui.changeViewMode(this.value)">
            <option value="detailed">Detailed View</option>
            <option value="clustered">Clustered View</option>
        </select>

        <select id="clusterMethodSelect" style="display:none; margin-left: 10px;"
                onchange="transportSystem.ui.applyClusterMethod(this.value)">
            <option value="department_type">By Department Type</option>
            <option value="kmeans">K-Means Clustering</option>
            <option value="hierarchical">Hierarchical Clustering</option>
        </select>
    </div>

    <div class="request-form">
        <h3>Create New Transport Request</h3>

        <label for="originDropdown">Origin:</label>
        <select id="originDropdown"></select>

        <label for="destinationDropdown">Destination:</label>
        <select id="destinationDropdown"></select>

        <label for="typeDropdown">Transport Type:</label>
        <select id="typeDropdown">
            <option value="stretcher">Stretcher</option>
            <option value="wheelchair">Wheelchair</option>
        </select>

        <label for="urgentDropdown">Urgency:</label>
        <select id="urgentDropdown">
            <option value="true">Urgent</option>
            <option value="false">Not Urgent</option>
        </select>

        <button onclick="createRequest()">Create Request</button>
    </div>
    <button id="toggleTableBtn">📂 Show/Hide Transport Table</button>

<div id="transportTableContainer">
    <div class="transport-table">
        <h3>📋 All Transports</h3>
        <table id="transportTable">
            <thead>
                <tr>
                    <th>Origin</th>
                    <th>Destination</th>
                    <th>Type</th>
                    <th>Urgent</th>
                    <th>Transporter</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

    <svg viewBox="-100 -100 1400 1000"></svg>

    <!-- Load main.js after hospital-transport-utils.js -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <!-- Additional script for strategy selection -->
    <script>
        // Function to populate the strategy dropdown
        function populateStrategyDropdown() {
            const strategyDropdown = document.getElementById("strategyDropdown");
            if (!strategyDropdown) {
                console.warn("Strategy dropdown not found");
                return;
            }

            // Clear existing options
            strategyDropdown.innerHTML = '<option value="">Loading strategies...</option>';

            // Fetch available strategies from server
            fetch(`${HospitalTransport.config.socketUrl}/get_available_strategies`)
                .then(response => response.json())
                .then(strategies => {
                    // Clear loading option
                    strategyDropdown.innerHTML = '';

                    // Add strategies to dropdown
                    strategies.forEach(strategy => {
                        const option = document.createElement('option');
                        option.value = strategy;
                        option.textContent = strategy;
                        strategyDropdown.appendChild(option);
                    });

                    // Set default selection to ILP: Makespan if available
                    const defaultStrategy = strategies.find(s => s === "ILP: Makespan");
                    if (defaultStrategy) {
                        strategyDropdown.value = defaultStrategy;
                    }

                    console.log(`Loaded ${strategies.length} optimization strategies`);
                })
                .catch(error => {
                    console.error("Error loading strategies:", error);
                    HospitalTransport.log.add("Failed to load optimization strategies", "error");

                    // Set a fallback option
                    strategyDropdown.innerHTML = '<option value="">No strategies available</option>';
                });
        }

        // Function to deploy the selected strategy
        function deploySelectedStrategy() {
            const strategyDropdown = document.getElementById("strategyDropdown");
            if (!strategyDropdown || !strategyDropdown.value) {
                HospitalTransport.log.add("Please select an optimization strategy", "error");
                return;
            }

            const selectedStrategy = strategyDropdown.value;
            HospitalTransport.log.add(`Deploying strategy: ${selectedStrategy}`, "info");

            // Set the selected strategy
            HospitalTransport.simulation.setStrategy(selectedStrategy, () => {
                // After setting the strategy, deploy it
                HospitalTransport.simulation.deployStrategy(() => {
                    HospitalTransport.log.add(`${selectedStrategy} deployed successfully`, "success");
                });
            });
        }

        // Override deployOptimization to use the selected strategy
        function deployOptimization() {
            // Use the selected strategy instead of hard-coded "ILP: Makespan"
            const strategyDropdown = document.getElementById("strategyDropdown");
            if (!strategyDropdown || !strategyDropdown.value) {
                // Fallback to ILP: Makespan if no strategy is selected
                HospitalTransport.simulation.setStrategy("ILP: Makespan", () => {
                    HospitalTransport.simulation.deployStrategy();
                });
            } else {
                HospitalTransport.simulation.setStrategy(strategyDropdown.value, () => {
                    HospitalTransport.simulation.deployStrategy();
                });
            }
        }

        // Override simulateOptimally to use the selected strategy
        function simulateOptimally() {
            // Use the selected strategy instead of hard-coded "ILP: Makespan"
            const strategyDropdown = document.getElementById("strategyDropdown");
            const selectedStrategy = strategyDropdown?.value || "ILP: Makespan";

            HospitalTransport.simulation.setStrategy(selectedStrategy, () => {
                HospitalTransport.simulation.start();

                // Update UI
                document.getElementById("stopSimulationBtn").style.display = "inline-block";
                document.getElementById("simulateOptimally").style.display = "none";
                document.getElementById("simulateRandomly").style.display = "none";
            });
        }

        // Initialize the strategy dropdown when the page loads
        document.addEventListener('DOMContentLoaded', function() {
            populateStrategyDropdown();

            // Add event handler for the deploy button
            const deployBtn = document.getElementById("deployStrategyBtn");
            if (deployBtn) {
                deployBtn.addEventListener("click", deploySelectedStrategy);
            }
        });
    </script>
</body>
</html>
